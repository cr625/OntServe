# Cross-component concept manifest (reconciliation pass, 2026-06-24)  [DRAFT for sign-off]
#
# Purpose: many concepts shadow themselves across components (one idea emitted as a Principle AND an
# Obligation AND a Capability AND a Constraint). The 9-component formalism legitimately has DISTINCT
# facets of one concept; the problem is redundant COPY-PASTE shadows that do no distinct work and are
# not structurally linked. This manifest declares, per concept, which facets are GENUINE (kept + linked)
# and which are shadows (dropped, content folded into the kept facet). It is the single place that links
# the per-component sheets into concepts.
#
# POLICY APPLIED (facet-retention rules) -- CONFIRMED by user 2026-06-24.
# Loader contract: the per-component <component>.yaml files hold canonical/alt_labels/do_not_mint; THIS
# manifest is the cross-component authority -- entries in `constraint_fold` (and the dropped Capability
# shadows in `concepts[].drop_shadows`) are EXCLUDED from the injected canonical set and instead act as
# alias/redirects to the named Obligation. Component files are not physically pruned; the manifest wins.
policy:
  principle:  keep the underlying value (one per genuine value).
  obligation: keep the positive action-guiding duty; link `derivedFromPrinciple` -> its Principle.
  state:      keep conditions that activate/defeat; link `activatesObligation` / `defeasibleUnder`.
  action_event: keep the act / occurrence.
  capability: keep ONLY a genuinely distinct competence; DROP restatements of the duty/value
              (e.g. "Disclosure Capability", "Professional Accountability Capability").
  constraint: keep ONLY a HARD prohibition / inviolable limit that is NOT merely the negation of an
              existing Obligation. Defeasible competition ("safety overrides confidentiality") is
              expressed with prevailsOver / defeasibleUnder edges on the Obligations, NOT a duplicate
              Constraint class.
  idioms: proper-noun terms of art kept canonical regardless (decision 5).

# ===========================================================================
# GLOBAL RULES (cross-component hygiene; declared ONCE here, applied to all 9 components)
# ===========================================================================
# These are the domain-portable rules that are NOT specific to any one component (contrast the
# per-component do_not_mint recipes, which encode each component's distinct canonicalization
# semantics). One declarative source, three consumers: (1) injected into every component's
# reuse-bias prompt block (reference_sheet.prompt_block), (2) the future commit-time normalizer
# enforces them deterministically, (3) SHACL/judge validate them. A second domain (legal ethics)
# defines its own global_rules here (the principles are portable; the examples are domain-flavored).
# scope: "all" (every component) or a list of core Categories (e.g. [Constraint, Resource]).
global_rules:
  - id: context-not-in-class-identity
    scope: all
    rule: >-
      Express case-specific context (a particular tool, domain, bearer, conduct, or trigger) as a
      State, an edge, or a literal on the individual; never bake it into a new class name.
  - id: no-tool-technology-prefix
    scope: all
    rule: >-
      Do NOT prefix a class name with a specific tool or technology (e.g. AI, CADD, CD-ROM, software):
      reuse the tool-neutral canonical class and record the specific tool as an otherAttribute literal
      on the individual or as a State. For example, a tool-substitution prohibition is
      ToolSubstitutionProhibitionConstraint, NOT AITechnologySubstitutionConstraint.
  - id: no-actor-in-class-label
    scope: all
    rule: >-
      Do NOT put a specific actor (e.g. Engineer A, Client W) in a class label; the actor is an
      individual, not part of the class identity.

# ===========================================================================
# CONCEPTS (the 15 cross-component families; facets kept + linked, shadows dropped)
# ===========================================================================
concepts:

  - concept: AI Tool Disclosure
    facets:
      principle: TransparencyPrinciple
      obligation: AIToolDisclosureObligation        # derivedFromPrinciple TransparencyPrinciple
      state: ToolRelianceState                       # activatesObligation AIToolDisclosureObligation
      action: Disclosure
    drop_shadows:
      - {component: constraint, label: AI Tool Disclosure Constraint, fold_into: AIToolDisclosureObligation}
      - {component: capability, label: Disclosure Capability, action: "KEEP as umbrella competence (absorbs the case-specific *Disclosure Capability variants as alt_labels)"}
      - {component: resource,  label: AI Tool Use Standard Resource, fold_into: TechnicalStandard}
    links:
      - AIToolDisclosureObligation derivedFromPrinciple TransparencyPrinciple
      - ToolRelianceState activatesObligation AIToolDisclosureObligation

  - concept: Peer Review Cooperation
    facets:
      principle: PeerReviewCooperationPrinciple
      obligation: PeerReviewCooperationObligation
      state: PeerReviewConsentState
      action: DesignReview                            # peer review folds into the general DesignReview act (alt_label)
    drop_shadows:
      - {component: constraint, label: Peer Review Cooperation Constraint, fold_into: PeerReviewCooperationObligation}
      - {component: constraint, label: Covert Review Prohibition Constraint, curate: "genuine prohibition? or = Secret Review Refusal Obligation"}
      - {component: capability, label: Professional Accountability Capability, action: "KEEP as umbrella competence (absorbs accountability/cooperation capability variants)"}
      - {component: obligation, label: Secret Review Refusal Obligation, action: "merge into PeerReviewCooperationObligation OR keep as the prohibition facet -- curate"}
    links:
      - PeerReviewCooperationObligation derivedFromPrinciple PeerReviewCooperationPrinciple

  - concept: Corrective Action Monitoring
    facets:
      principle: CorrectiveActionMonitoringPrinciple
      obligation: CorrectiveActionMonitoringObligation   # absorbs "Regulatory Compliance Verification Obligation"
      # no distinct State facet: "remediation monitoring" is the activated duty (the Obligation), not a state kind
    drop_shadows:
      - {component: constraint, label: Corrective Action Monitoring Constraint, fold_into: CorrectiveActionMonitoringObligation}
      - {component: obligation, label: Regulatory Compliance Verification Obligation, fold_into: CorrectiveActionMonitoringObligation}

  - concept: Responsible Charge Active Engagement
    facets:
      role: ResponsibleChargeEngineer                # (roles.yaml)
      principle: ResponsibleChargePrinciple
      obligation: DelegatedWorkReviewObligation
      state: SupervisoryDirectionState               # + VerificationActivityState, SealAuthorityState
    drop_shadows:
      - {component: constraint, label: Responsible Charge Supervision Constraint, fold_into: DelegatedWorkReviewObligation}
      - {component: constraint, label: Detailed Review Sufficiency Constraint, fold_into: DelegatedWorkReviewObligation}
      - {component: constraint, label: Personal Preparation Seal Constraint, action: "KEEP -- bright-line (seal only personally-prepared work); genuine inviolable limit"}

  - concept: Non-Engineering Expert Scope
    facets:
      role: NonEngineerExpertWitness                 # (roles.yaml)
      principle: NonEngineeringExpertServicesPrinciple
      obligation: NonEngineeringExpertScopeLimitationObligation
      state: ScopeLimitationState                     # + CredentialMisrepresentationState
    drop_shadows:
      - {component: constraint, label: Non-Engineering Expert Scope Constraint, fold_into: NonEngineeringExpertScopeLimitationObligation}
      - {component: capability, label: Scope Boundary Recognition Capability, action: "KEEP -- a genuine recognition competence (distinct from the duty)"}

  - concept: Expertise-Calibrated Disclosure
    facets:
      principle: ExpertiseCalibratedDisclosurePrinciple
      state: CompetenceGapState
    drop_shadows:
      - {component: constraint, label: Expertise Domain Reporting Constraint, fold_into: ExpertiseCalibratedDisclosurePrinciple-derived obligation}

  - concept: Dual Capacity / Self-Review
    facets:
      state: DualCapacityState                        # + ConflictOfInterestState
      obligation: DualRoleConflictDisclosureObligation  # + ObjectivityObligation
    drop_shadows:
      - {component: constraint, label: Dual Capacity Constraint, fold_into: ObjectivityObligation, via: "DualCapacityState activatesObligation"}
      - {component: constraint, label: Self-Review Prohibition Constraint, action: "KEEP -- bright-line (do not review/approve own work); genuine prohibition"}

  - concept: Confidentiality
    facets:
      principle: ConfidentialityPrinciple
      obligation: ConfidentialityObligation
    links:
      - ConfidentialityObligation derivedFromPrinciple ConfidentialityPrinciple
    note: clean 2-facet concept; no shadows to drop.

  - concept: Faithful Agent  (idiom; kept)
    facets:
      principle: LoyaltyPrinciple
      obligation: FaithfulAgentObligation
    drop_shadows:
      - {component: constraint, label: Faithful Agent Limit Constraint, fold_into: ConfidentialityOverrideSafetyObligation, via: "SafetyObligation prevailsOver ConfidentialityObligation"}
    note: ConfidentialityOverrideSafety is a COMPETITION rule -> materialize as prevailsOver/defeasibleUnder, not a class. (curate)

  - concept: Public Safety Paramount  (idiom; kept)
    facets:
      principle: PublicWelfarePrinciple
      obligation: PublicSafetyParamountObligation
    drop_shadows:
      - {component: constraint, label: Public Safety Paramount Constraint, fold_into: PublicSafetyParamountObligation, via: "prevailsOver every competing obligation"}
    note: paramount = prevailsOver edges, not a duplicate Constraint class.

  - concept: Self-Certification Prohibition
    facets:
      principle: SelfCertificationProhibitionPrinciple
      constraint: SelfCertificationProhibitionConstraint   # KEEP -- genuine hard prohibition
    note: prohibition is the primary facet; principle is the value behind it.

  - concept: Tool Substitution Prohibition
    facets:
      principle: ToolSubstitutionProhibitionPrinciple
      constraint: ToolSubstitutionProhibitionConstraint    # KEEP -- genuine hard prohibition
    note: Technology Replacement Prohibition merges in as an alt_label.

  - concept: Schedule Pressure Resistance
    facets:
      principle: SchedulePressureResistancePrinciple
      capability: RiskAssessmentCapability             # KEEP -- genuine competence (distinct)
      state: DeadlinePressureState                     # (alt_label: Deadline Pressure Compromise State)
    note: principle + a real competence + the pressure State; no redundant shadow.

  - concept: Whistleblower Personal Conscience
    facets:
      principle: WhistleblowerPersonalConsciencePrinciple
      state: WhistleblowingState
    drop_shadows:
      - {component: constraint, label: Whistleblower Scope Constraint, curate: "genuine scope limit on whistleblowing, or fold to the principle/obligation?"}

  - concept: Submission (A/E boundary)
    facets:
      action: Submission
      event: SubmissionEvent
    note: legitimately both -- the act (Action) and its completion (Event); keep both, link via triggersEvent.

# ===========================================================================
# CONSTRAINT reconciliation (fixes the 42->~12 over-retention)
